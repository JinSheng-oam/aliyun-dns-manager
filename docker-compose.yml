services:
  aliyun-dns-manager:
    build:
      context: .
    image: aliyun-dns-manager:0.4.0
    container_name: aliyun-dns-manager
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      APP_DATA_DIR: /app/data
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
